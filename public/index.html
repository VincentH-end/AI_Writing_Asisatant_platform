async function refresh(render=true){D=await api('/api/project');for(const k of ['chapters','entities','events','materials','techniques','branches','runs'])D[k]??=[];if(!D.chapters.some(x=>x.id===chapterId))chapterId=D.chapters[0]?.id??null;if(render)renderAll()}
function renderAll(){if(!D)return;$('projectName').textContent=$('crumbName').textContent=D.project.title;$('projectGenre').textContent=(D.project.genre||'长篇小说')+' · '+D.chapters.length+' 章';$('providerStatus').textContent=D.settings?.model?'模型 · '+D.settings.model:'请先配置模型 API';$('agentModel').textContent=D.settings?.model||'等待配置';$('saveState').textContent=dirty?'● 有未保存修改':'✓ 已保存到本地';const nav=[['editor','✎','故事编辑'],['characters','♙','人物与关系'],['world','◇','世界设定'],['events','◷','事件与状态'],['materials','▤','素材库'],['techniques','✧','写作技巧'],['review','◎','故事审阅'],['stats','▥','创作统计'],['search','⌕','全局搜索']];$('nav').innerHTML=nav.map(([id,icon,title])=>'<button class="'+(view===id?'active':'')+'" onclick="showView(\''+id+'\')"><span>'+icon+'</span>'+title+'</button>').join('');$('chapterList').innerHTML=D.chapters.map((c,i)=>'<button class="chapter '+(c.id===chapterId?'active':'')+'" data-chapter="'+esc(c.id)+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+esc(c.title)+(c.status==='draft'?' · 草稿':'')+'</button>').join('')||empty('点击 + 创建第一章');$('chapterList').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>selectChapter(b.dataset.chapter));$('tabs').innerHTML=[['editor','正文创作'],['outline','故事大纲'],['branches','故事分支'],['drafts','草稿箱']].map(([id,t])=>'<button class="'+(view===id?'active':'')+'" onclick="showView(\''+id+'\')">'+t+'</button>').join('')+'<span class="right">让每个故事，都有回响</span>';$('content').innerHTML=renderView();renderContext();setBusy(busy);if(view==='characters')renderGraph();}
async function guardSave(){if(dirty)await saveChapter(false);if(projectDirty)await saveOutline(false)}
async function selectChapter(id){if(busy||requestPending)return toast('请等待当前调用完成后切换章节');try{await guardSave();chapterId=id;activeRun=null;view='editor';renderAll()}catch(e){toast(e.message,true)}}
async function showView(v){if(busy||requestPending)return toast('请等待当前任务完成');try{await guardSave();view=v;renderAll();if(v==='characters')renderGraph()}catch(e){toast(e.message,true)}}
function markDirty(){dirty=true;$('saveState').textContent='● 有未保存修改'}
async function saveChapter(notify=true){try{if(!ch()){if(notify)toast('请先创建章节');return}const body={};if($('chapterTitle'))body.title=val('chapterTitle');if($('prose'))body.content=val('prose');if($('chapterOutline'))body.outline=val('chapterOutline');if(!Object.keys(body).length){if(notify)toast('当前章节没有需要保存的编辑');return}await api('/api/chapters/'+encodeURIComponent(chapterId),'PUT',body);Object.assign(ch(),body);dirty=false;$('saveState').textContent='✓ 已保存到本地';if(notify)toast('章节已保存')}catch(e){toast(e.message,true);throw e}}
function renderView(){switch(view){case'editor':return editor();case'outline':return outlineView();case'characters':return entityView(true);case'world':return entityView(false);case'events':return collectionView('events','事件与状态','沿着时间，追踪每一次改变。');case'materials':return collectionView('materials','故事的灵感书架','手动收集素材，也可以请模型生成创作灵感。');case'techniques':return collectionView('techniques','让叙事更有回响','管理技巧、埋设章节与回收章节。');case'branches':return branchView();case'drafts':return draftView();case'review':return reviewView();case'stats':return statsView();case'search':return wrap('找回故事里的每一个细节','检索当前项目的章节、人物、设定与素材。','<form onsubmit="event.preventDefault();searchAll()"><input class="search-input" id="searchQuery" placeholder="输入关键词，例如：灯塔、铜钥匙" aria-label="搜索关键词"><button class="btn primary">搜索</button><button type="button" class="btn" onclick="unsupported(\'AI 语义搜索\',\'当前支持关键词检索；向量检索与语义索引尚未实现。\')">语义搜索 · 待实现</button></form><div id="searchResults" class="data-list" style="margin-top:20px"></div>');case'runs':return runsView();default:return''}}
function editor(){const c=ch();if(!c)return wrap('故事从这里开始','创建一个章节，写下第一句话。','<button class="btn primary" onclick="newChapter()">＋ 新建章节</button>');return '<div class="toolbar"><select class="mode-select" aria-label="创作模式" onchange="mode=this.value"><option value="assist" '+(mode==='assist'?'selected':'')+'>人工 + AI 协作</option><option value="manual" '+(mode==='manual'?'selected':'')+'>纯人工创作</option><option value="autonomous" '+(mode==='autonomous'?'selected':'')+'>AI 单章创作</option></select><span class="sep"></span><button class="ai" data-ai onclick="aiTask(\'continue\')">✧ AI 续写</button><button class="ai" data-ai onclick="aiTask(\'polish\')">润色本章</button><button class="ai" data-ai onclick="aiTask(\'branches\')">探索分支</button><button onclick="unsupported(\'富文本格式\',\'当前正文使用纯文本编辑，暂不支持加粗、斜体等富文本格式。\')">格式 · 待实现</button><span class="grow"></span><button onclick="revisions()">历史版本</button><button onclick="document.getElementById(\'app\').classList.toggle(\'focus\')">专注</button></div><section class="editor-area"><article class="paper"><div class="chapter-meta"><span>'+esc(c.volume||'正文')+' / '+String(D.chapters.indexOf(c)+1).padStart(2,'0')+'</span><b>'+esc(c.status==='draft'?'草稿':'编辑中')+'</b></div><h1><input id="chapterTitle" value="'+esc(c.title)+'" aria-label="章节标题" oninput="markDirty()"></h1><textarea id="prose" class="prose" placeholder="在这里写下故事的第一句话…" oninput="markDirty();document.getElementById(\'wordCount\').textContent=this.value.replace(/\\s/g,\'\').length" aria-label="章节正文">'+esc(c.content)+'</textarea>'+resultPanel()+'</article><div class="paper-foot"><span>本章 <span id="wordCount">'+String(c.content||'').replace(/\s/g,'').length+'</span> 字 · UTF-8</span><span>Ctrl / ⌘ + S 保存 &nbsp; · &nbsp; AI 结果须审阅</span></div></section>'}
function resultPanel(){const r=activeRun&&D.runs.find(x=>x.id===activeRun);if(!r)return'';let controls='';if(['succeeded','draft'].includes(r.status)){if(r.task==='branches')controls='<button class="btn primary" onclick="showView(\'branches\')">选择具体分支</button>';else if(r.task==='material')controls='<button class="btn primary" onclick="acceptRun(\'append\')">保存为素材</button>';else if(!['review','chat'].includes(r.task))controls=r.task==='polish'?'<button class="btn primary" onclick="acceptRun(\'replace\')">接受并替换本章</button>':'<button class="btn primary" onclick="acceptRun(\'append\')">'+(['extract','summarize','outline'].includes(r.task)?'确认并应用':'接受并追加正文')+'</button>';controls+=(r.status!=='draft'?'<button class="btn" onclick="acceptRun(\'draft\')">存入草稿</button>':'')+'<button class="btn" onclick="rejectRun()">拒绝</button>'}return '<section class="suggestion"><div class="s-title"><span>✧ '+esc(taskLabel(r.task))+' · '+esc(labelStatus(r.status))+'</span><button onclick="inspectRun()">上下文详情 ↗</button></div>'+(r.warning?'<p class="warning">'+esc(r.warning)+'</p>':'')+'<pre class="result-text">'+esc(r.output||r.error||'暂无输出')+'</pre><div class="button-row">'+controls+'</div></section>'}
function taskLabel(t){return{continue:'正文续写',outline:'大纲规划',polish:'文字润色',review:'一致性审阅',branches:'故事分支',brainstorm:'头脑风暴',chat:'创作对话',summarize:'章节摘要',extract:'状态提取',material:'素材灵感'}[t]||t}
function renderContext(){const c=ch();$('context').innerHTML='<div class="context-head"><b>故事上下文</b><span class="avatar">叙</span></div><section class="section"><div class="section-title"><span>本章大纲</span><button onclick="showView(\'outline\')">编辑 ↗</button></div><pre>'+esc(c?.outline||'尚未设置章节大纲。')+'</pre><label class="context-check"><input id="useOutline" type="checkbox" onchange="useOutline=this.checked" '+(useOutline?'checked':'')+'>创作时参考大纲</label></section>'+contextChecks('entities','关联人物与设定',D.entities)+contextChecks('materials','参考素材',D.materials)+contextChecks('techniques','叙事技巧',D.techniques)+'<section class="section"><div class="section-title">上下文管理</div><p class="outline-text">项目与章节大纲、相关状态、历史摘要与近期正文按预算组合；勾选内容优先进入参考范围。</p><span class="tag">预算 '+esc(D.settings?.context_budget||'—')+'</span><button class="chip" onclick="showView(\'runs\')">查看实际上下文</button></section><div class="note">“故事不是一条直线，<br>是所有选择留下的潮汐。”</div>'}
function contextChecks(key,title,items){return '<section class="section"><div class="section-title">'+title+'<small>'+items.length+' 项</small></div>'+items.slice(0,8).map(x=>'<label class="context-check"><input type="checkbox" '+(selected[key].has(x.id)?'checked':'')+' data-key="'+key+'" data-id="'+esc(x.id)+'" onchange="toggleContext(this)">'+esc(x.name||x.title)+'</label>').join('')+(!items.length?'<small>暂无记录</small>':'')+(items.length>8?'<small>在对应列表可选择其他记录</small>':'')+'</section>'}
function toggleContext(el){if(el.checked)selected[el.dataset.key].add(el.dataset.id);else selected[el.dataset.key].delete(el.dataset.id)}
function outlineView(){const c=ch();return wrap('先看见，故事的远方','项目全局大纲与章节大纲分别管理。','<article class="card"><h3>'+esc(D.project.title)+' · 项目设定</h3><label class="hint">一句话梗概</label><textarea id="projectSynopsis" class="outline-box" oninput="projectDirty=true">'+esc(D.project.synopsis)+'</textarea><label class="hint">全书大纲</label><textarea id="projectOutline" class="outline-box" oninput="projectDirty=true" style="min-height:190px">'+esc(D.project.outline)+'</textarea><div class="button-row"><button class="btn primary" onclick="saveOutline()">保存项目设定</button></div></article>'+(c?'<article class="card" style="margin-top:18px"><h3>'+esc(c.title)+' · 本章大纲</h3><textarea id="chapterOutline" class="outline-box" oninput="markDirty()">'+esc(c.outline)+'</textarea><div class="button-row"><button class="btn" onclick="saveChapter()">保存章节大纲</button><button class="btn primary" data-ai onclick="aiTask(\'outline\',\'根据全书梗概、当前进度和已有设定，规划本章大纲\')">✧ AI 规划本章</button></div></article>':''))}
async function saveOutline(notify=true){try{await api('/api/project','PUT',{synopsis:val('projectSynopsis'),outline:val('projectOutline')});await refresh(false);projectDirty=false;if(notify)toast('项目梗概与大纲已保存')}catch(e){toast(e.message,true);throw e}}
function entityView(characters){const items=D.entities.filter(x=>characters?['character','人物'].includes(x.type):!['character','人物'].includes(x.type));return wrap(characters?'让人物，拥有自己的故事':'构建故事的世界',characters?'人物的状态与关系，随章节留下可追溯的变化。':'背景、规则、场景、道具、技能与势力，共享统一设定索引。','<div class="button-row" style="margin-bottom:22px"><button class="btn primary" onclick="editRecord(\'entities\',null,\''+(characters?'character':'setting')+'\')">＋ '+(characters?'添加人物':'添加设定')+'</button><button class="btn" data-ai onclick="aiTask(\'extract\')">✧ 从本章提取状态</button></div>'+(characters?graphShell():'')+'<div class="cards">'+(items.map(x=>card(x.name,x.description,'<div class="relation-list">当前状态：'+esc(typeof x.state==='object'?JSON.stringify(x.state):x.state||'未设置')+'<br>关联章节：'+esc(chapterTitle(x.chapter_id))+'</div><div class="card-footer"><label><input type="checkbox" data-key="entities" data-id="'+esc(x.id)+'" '+(selected.entities.has(x.id)?'checked':'')+' onchange="toggleContext(this)"> 创作参考</label><button data-edit="'+esc(x.id)+'" onclick="editRecord(\'entities\',this.dataset.edit)">详情与编辑 →</button></div>',entityLabel(x.type)+' / '+x.id)).join('')||empty())+'</div>')}
function entityLabel(t){return{character:'人物',setting:'设定',background:'背景',rule:'规则',scene:'场景',item:'道具',skill:'技能',faction:'势力'}[t]||t}
function chapterTitle(id){return D.chapters.find(c=>c.id===id)?.title||(id||'未关联')}
function collectionView(key,title,intro){return wrap(title,intro,'<div class="button-row" style="margin-bottom:22px"><button class="btn primary" onclick="editRecord(\''+key+'\')">＋ 新建'+({events:'事件',materials:'素材',techniques:'技巧'}[key])+'</button>'+(key==='materials'?'<button class="btn" data-ai onclick="aiTask(\'material\',\'为当前故事提供场景、意象和感官细节素材，明确是创作灵感而非真实史料\')">✧ AI 素材灵感</button><button class="btn" onclick="unsupported(\'联网素材检索\',\'尚未接入搜索服务。当前可手动添加素材或使用模型生成的灵感；模型输出不能视为已检索的事实。\')">联网获取素材</button>':'')+'</div><div class="cards">'+(D[key].map(x=>card(x.title||x.name,x.content||x.description,'<div class="relation-list">'+(key==='events'?'状态：'+esc(labelStatus(x.status))+'<br>主题：'+esc(x.theme||'未填写')+' · 结局：'+esc(x.ending||'未填写'):key==='techniques'?'适用范围：'+esc(x.scope||'本章')+'<br>埋设：'+esc(chapterTitle(x.planted_chapter))+'<br>回收：'+esc(chapterTitle(x.payoff_chapter)):'标签：'+esc(Array.isArray(x.tags)?x.tags.join(' · '):x.tags||'无'))+'</div><div class="card-footer">'+(key!=='events'?'<label><input type="checkbox" data-key="'+key+'" data-id="'+esc(x.id)+'" '+(selected[key].has(x.id)?'checked':'')+' onchange="toggleContext(this)"> 创作参考</label>':'<span>'+esc(chapterTitle(x.chapter_id))+'</span>')+'<button data-edit="'+esc(x.id)+'" onclick="editRecord(\''+key+'\',this.dataset.edit)">编辑 →</button></div>',x.id)).join('')||empty())+'</div>')}
function field(id,label,value='',type='input'){return '<label for="'+id+'">'+esc(label)+'</label>'+(type==='textarea'?'<textarea id="'+id+'">'+esc(typeof value==='object'?JSON.stringify(value,null,2):value)+'</textarea>':'<input id="'+id+'" value="'+esc(value)+'">')}
function chapterOptions(id,value=''){return '<select id="'+id+'"><option value="">未关联</option>'+D.chapters.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===value?'selected':'')+'>'+esc(c.title)+'</option>').join('')+'</select>'}
let recordEditing=null;
function editRecord(key,id=null,type='character'){const r=D[key].find(x=>x.id===id)||{};recordEditing={key,id};let form=field('recName',key==='entities'||key==='techniques'?'名称':'标题',r.name||r.title);if(key==='entities')form+='<label>设定类别</label><select id="recType">'+['character','background','rule','scene','item','skill','faction','setting'].map(t=>'<option value="'+t+'" '+((r.type||type)===t?'selected':'')+'>'+entityLabel(t)+'</option>').join('')+'</select>';form+=field('recBody',key==='materials'?'素材内容':'描述',r.content||r.description,'textarea');if(key==='entities'){form+=field('recState','当前状态（自由文本）',typeof r.state==='object'?JSON.stringify(r.state):r.state,'textarea')+field('recRelations','人物关系 JSON 数组（可填写 target_id、label、description）',r.relations||[],'textarea')+'<label>关联章节</label>'+chapterOptions('recChapter',r.chapter_id);form+='<h3>状态历史</h3>'+((r.history||[]).map(h=>'<div class="history-entry">'+esc(chapterTitle(h.chapter_id))+'<br>'+esc(typeof h==='object'?JSON.stringify(h):h)+'</div>').join('')||'<p class="hint">尚无历史记录。</p>')}if(key==='events')form+=field('recStatus','状态：planned / active / resolved',r.status||'planned')+field('recTheme','事件主题',r.theme)+field('recEnding','计划或实际结局',r.ending)+'<label>关联章节</label>'+chapterOptions('recChapter',r.chapter_id);if(key==='materials')form+=field('recTags','标签（用逗号分隔）',Array.isArray(r.tags)?r.tags.join(','):r.tags);if(key==='techniques')form+=field('recScope','适用范围',r.scope||'本章')+field('recStatus','状态：planned / planted / resolved',r.status||'planned')+'<label>埋设章节</label>'+chapterOptions('recPlanted',r.planted_chapter)+'<label>回收章节</label>'+chapterOptions('recPayoff',r.payoff_chapter);modal('<h2>'+(id?'编辑记录':'添加记录')+'</h2>'+form+'<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveRecord()">保存</button></div>')}
async function saveRecord(){try{const{key,id}=recordEditing,name=val('recName').trim();if(!name)throw Error('请填写名称或标题');let b={};if(key==='entities'){let relations;try{relations=JSON.parse(val('recRelations')||'[]');if(!Array.isArray(relations))throw Error()}catch{throw Error('人物关系须为有效的 JSON 数组，例如 []')};b={name,type:val('recType'),description:val('recBody'),state:val('recState'),relations,chapter_id:val('recChapter')||''}}if(key==='events')b={title:name,description:val('recBody'),status:val('recStatus'),theme:val('recTheme'),ending:val('recEnding'),chapter_id:val('recChapter')||''};if(key==='materials')b={title:name,content:val('recBody'),tags:val('recTags').split(/[,，]/).map(s=>s.trim()).filter(Boolean)};if(key==='techniques')b={name,description:val('recBody'),scope:val('recScope'),status:val('recStatus'),planted_chapter:val('recPlanted')||'',payoff_chapter:val('recPayoff')||''};await api('/api/'+key+(id?'/'+encodeURIComponent(id):''),id?'PUT':'POST',b);closeModal();await refresh();toast('记录已保存')}catch(e){toast(e.message,true)}}
function branchView(){return wrap('同一个起点，不同的故事','分支先保留为候选，接受后才进入正文或草稿。','<button class="btn primary" data-ai onclick="aiTask(\'branches\')">✧ 生成故事分支</button><div class="cards" style="margin-top:22px">'+(D.branches.map(b=>card(b.title,b.content,'<div class="card-footer"><span>'+esc(labelStatus(b.status))+'</span><button data-branch="'+esc(b.id)+'" onclick="previewBranch(this.dataset.branch)">阅读分支 →</button></div>',chapterTitle(b.chapter_id))).join('')||empty('尚无分支。选择一个章节，探索它的另一种可能。'))+'</div>')}
function previewBranch(id){const b=D.branches.find(x=>x.id===id);modal('<h2>'+esc(b.title)+'</h2><pre class="result-text">'+esc(b.content)+'</pre><div class="modal-actions">'+(!['accepted','draft'].includes(b.status)?'<button class="btn" data-id="'+esc(id)+'" onclick="acceptBranch(this.dataset.id,\'draft\')">存入草稿</button><button class="btn primary" data-id="'+esc(id)+'" onclick="acceptBranch(this.dataset.id,\'append\')">追加到来源章节</button>':'<span class="status">'+esc(labelStatus(b.status))+'</span>')+'</div>')}
async function acceptBranch(id,destination){if(busy||requestPending)return toast('请等待当前任务完成');requestPending=true;setBusy(true,'正在保存编辑并准备操作…');try{await guardSave();setBusy(true,'正在保存分支与维护状态…');const result=await api('/api/branches/'+encodeURIComponent(id)+'/accept','POST',{destination});closeModal();await refresh();showWarnings(result,destination==='draft'?'分支已存入草稿':'分支已追加到来源章节')}catch(e){toast(e.message,true)}finally{requestPending=false;setBusy(false)}}
function draftView(){const drafts=D.runs.filter(r=>r.status==='draft'),chapters=D.chapters.filter(c=>c.status==='draft');return wrap('暂存的文字，也有自己的去处','AI 候选按调用记录保留，不自动写入正文。章节草稿可以继续编辑。','<h3>AI 候选草稿</h3><div class="cards">'+(drafts.map(r=>card(taskLabel(r.task)+' · '+chapterTitle(r.chapter_id),(r.output||'').slice(0,180)+'…','<div class="card-footer"><button data-id="'+esc(r.id)+'" onclick="openRun(this.dataset.id)">重新审阅 →</button></div>')).join('')||empty('暂无候选草稿'))+'</div><h3>章节草稿</h3><div class="cards">'+(chapters.map(c=>card(c.title,(c.content||'').slice(0,180),'<div class="card-footer"><button data-id="'+esc(c.id)+'" onclick="selectChapter(this.dataset.id)">打开编辑 →</button><button data-id="'+esc(c.id)+'" onclick="promoteDraft(this.dataset.id)">转为正文</button></div>')).join('')||empty('暂无章节草稿'))+'</div>')}
async function promoteDraft(id){try{await api('/api/chapters/'+encodeURIComponent(id),'PUT',{status:'active'});await refresh();toast('草稿已转为正文章节')}catch(e){toast(e.message,true)}}
function reviewView(){const runs=D.runs.filter(r=>r.task==='review');return wrap('让故事，经得起回望','审阅基于本次上下文范围；输出是模型建议，需要作者判断。','<button class="btn primary" data-ai onclick="aiTask(\'review\')">✧ 审阅当前章节</button><div class="data-list" style="margin-top:22px">'+(runs.map(r=>card(chapterTitle(r.chapter_id),r.error||r.output,'<div class="card-footer"><span>'+esc(labelStatus(r.status))+'</span><button data-run="'+esc(r.id)+'" onclick="inspectRun(this.dataset.run)">上下文依据 →</button></div>')).join('')||empty('尚未执行审阅，不显示预设结论。'))+'</div>')}
function statsView(){const total=D.chapters.reduce((a,c)=>a+String(c.content||'').replace(/\s/g,'').length,0);return wrap('每一页，都是向前的一步','统计来自当前项目实际保存的数据。','<div class="cards">'+[['累计文字',total,'字 · '+D.chapters.length+' 个章节'],['故事世界',D.entities.length,'条人物与设定 · '+D.events.length+' 个事件'],['AI 调用',D.runs.length,'次记录 · '+D.runs.filter(r=>r.status==='failed').length+' 次失败'],['分支与素材',D.branches.length,'条分支 · '+D.materials.length+' 条素材']].map(([t,n,d])=>'<article class="card"><span class="eyebrow">'+t+'</span><div class="stat">'+n+'</div><p>'+esc(d)+'</p></article>').join('')+'</div><article class="card" style="margin-top:20px"><h3>章节篇幅</h3>'+D.chapters.map(c=>'<div class="toggle-row"><span>'+esc(c.title)+'</span><b>'+String(c.content||'').replace(/\s/g,'').length+' 字</b></div>').join('')+'</article>')}
function runsView(){return wrap('每一次协作，都有迹可循','查看模型输出、失败原因、上下文裁剪与调用详情。','<div class="data-list">'+(D.runs.map(r=>card(taskLabel(r.task)+' · '+chapterTitle(r.chapter_id),(r.error||r.output||'').slice(0,220),'<div class="card-footer"><span>'+esc(labelStatus(r.status))+' · '+esc(r.created_at||'')+'</span><button data-run="'+esc(r.id)+'" onclick="openRun(this.dataset.run)">打开结果 →</button><button data-run="'+esc(r.id)+'" onclick="inspectRun(this.dataset.run)">调用详情</button></div>')).join('')||empty('暂无调用记录。'))+'</div>')}
function inspectRun(id=activeRun){const r=D.runs.find(x=>x.id===id);if(!r)return toast('未找到调用记录');modal('<h2>'+esc(taskLabel(r.task))+' · 调用详情</h2><p class="hint">以下为后端实际记录；预算估计值不等于服务商精确 token 计费。</p><pre class="result-text">'+esc(JSON.stringify({id:r.id,status:r.status,model:r.model,created_at:r.created_at,context_manifest:r.context_manifest,usage:r.usage,error:r.error},null,2))+'</pre>')}
async function openRun(id){const r=D.runs.find(x=>x.id===id);try{await guardSave();if(r.chapter_id)chapterId=r.chapter_id;activeRun=id;view='editor';renderAll()}catch(e){toast(e.message,true)}}
async function searchAll(){try{const data=await api('/api/search?q='+encodeURIComponent(val('searchQuery')));$('searchResults').innerHTML=(data.results||[]).map(r=>card(r.title,r.text,'',r.type)).join('')||empty('没有匹配结果')}catch(e){toast(e.message,true)}}
async function aiTask(task,prompt=''){if(busy||requestPending)return toast('请等待当前模型调用完成');if(mode==='manual'&&task!=='chat')return toast('当前为纯人工模式，请先切换为“人工 + AI 协作”');if(!ch())return toast('请先创建并选择一个章节');if(!D.settings?.model){settings();toast('请先配置 API 地址与模型名称');return}requestPending=true;setBusy(true,'正在保存编辑并准备操作…');try{await guardSave();setBusy(true,'正在执行'+taskLabel(task)+'，将等待 API 返回真实结果…');const data=await api('/api/ai','POST',{task,chapter_id:chapterId,prompt,selected_entity_ids:[...selected.entities],selected_material_ids:[...selected.materials],selected_technique_ids:[...selected.techniques],use_outline:useOutline});await refresh(false);activeRun=data.run.id;if(task==='chat'){chat.push({q:prompt,a:data.run.output});renderChat()}else{view=task==='branches'?'branches':'editor';renderAll()}if(data.run.status==='failed')throw Error(data.run.error||'模型任务失败');if(data.run.warning)showWarnings({warnings:[data.run.warning]},'模型输出已返回');else toast('模型输出已返回，请审阅后决定是否采用')}catch(e){toast(e.message,true);try{await refresh(false)}catch{}}finally{requestPending=false;setBusy(false)}}
function renderChat(){$('chatHistory').innerHTML=chat.map(m=>'<div class="chat-item"><b>你</b> '+esc(m.q)+'<br><b>Agent</b> '+esc(m.a)+'</div>').join('');$('chatHistory').scrollTop=$('chatHistory').scrollHeight}
async function sendChat(){const q=val('chatInput').trim();if(!q)return;await aiTask('chat',q);if(chat.at(-1)?.q===q)$('chatInput').value=''}
async function acceptRun(destination){if(busy||requestPending)return;requestPending=true;setBusy(true,'正在保存编辑并准备操作…');try{await guardSave();setBusy(true,D.settings.auto_update?'正在接受结果并同步摘要与状态…':'正在保存已接受的结果…');const result=await api('/api/runs/'+encodeURIComponent(activeRun)+'/accept','POST',{destination});await refresh();showWarnings(result,destination==='draft'?'结果已存入草稿':'结果已应用，请检查正文或设定')}catch(e){toast(e.message,true)}finally{requestPending=false;setBusy(false)}}
async function rejectRun(){if(busy)return toast('请等待当前任务完成');try{await api('/api/runs/'+encodeURIComponent(activeRun)+'/reject','POST',{});await refresh();toast('已拒绝候选，正文未变更')}catch(e){toast(e.message,true)}}
function unsupported(title,reason){modal('<h2>'+esc(title)+'</h2><div class="warning"><strong>此功能尚未实现</strong>'+esc(reason)+'</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">知道了</button></div>')}
function autonomous(){modal('<h2>AI 单章自主创作</h2><p class="hint">根据梗概、大纲及选定参考生成当前章节候选，再由你确认。自动连续整本写作尚未实现。</p>'+field('autonomousPrompt','本章目标','根据当前项目的设定与已有故事进度，完整创作当前章节，推进核心冲突。','textarea')+'<div class="warning">单次生成受输出预算限制。开启“自动状态维护”后，接受正文可能产生额外的摘要与状态提取 API 调用。</div><div class="modal-actions"><button class="btn primary" onclick="const p=val(\'autonomousPrompt\');closeModal();mode=\'autonomous\';aiTask(\'continue\',p)">生成单章候选</button></div>')}
async function projects(){try{await guardSave();const d=await api('/api/projects');modal('<h2>你的故事书架</h2><p class="muted">每一本小说，都是一个独立的世界。</p><div class="data-list">'+d.projects.map(p=>'<button class="project" data-id="'+esc(p.id)+'" onclick="switchProject(this.dataset.id)"><span class="book-mini">叙</span><span><strong>'+esc(p.title)+'</strong><small>'+esc(p.genre||'长篇小说')+'</small></span><span style="margin-left:auto">继续 →</span></button>').join('')+'</div>'+field('newProjectName','新项目名称')+field('newProjectGenre','类型','悬疑 / 奇幻')+'<label>创作模式</label><select id="newProjectMode"><option value="assist">人工 + AI 协作</option><option value="manual">纯人工创作</option><option value="autonomous">AI 单章自主创作</option></select><div class="modal-actions"><button class="btn" onclick="document.getElementById(\'importFile\').click()">导入项目 JSON</button><button class="btn" onclick="unsupported(\'DOCX 导入\',\'当前仅支持叙间项目 JSON 导入，尚未实现 DOCX 文稿解析。可复制正文到章节编辑器。\')">DOCX 导入 · 待实现</button><button class="btn primary" onclick="createProject()">创建项目 →</button></div>')}catch(e){toast(e.message,true)}}
async function switchProject(id){if(busy)return toast('请等待当前调用完成后切换项目');try{await api('/api/projects/select','POST',{id});resetProjectState();closeModal();view='editor';await refresh();mode=D.project.mode||'assist';renderAll();renderChat()}catch(e){toast(e.message,true)}}
async function createProject(){if(busy)return toast('请等待当前调用完成');try{const title=val('newProjectName').trim();if(!title)throw Error('请输入项目名称');mode=val('newProjectMode');await api('/api/projects','POST',{title,genre:val('newProjectGenre'),mode});resetProjectState();closeModal();view='editor';await refresh();mode=D.project.mode||'assist';renderAll();toast('新项目已创建')}catch(e){toast(e.message,true)}}
function newChapter(){modal('<h2>给故事，新的一页</h2>'+field('newChapterTitle','章节标题','第 '+String((D?.chapters.length||0)+1)+' 章')+field('newChapterVolume','所属卷','第一卷')+'<div class="modal-actions"><button class="btn primary" onclick="createChapter()">创建章节</button></div>')}
async function createChapter(){try{await guardSave();if(!val('newChapterTitle').trim())throw Error('请填写章节标题');const data=await api('/api/chapters','POST',{title:val('newChapterTitle'),volume:val('newChapterVolume')});closeModal();await refresh(false);chapterId=data.record?.id||data.chapter?.id||data.id||D.chapters.at(-1)?.id;view='editor';activeRun=null;renderAll();toast('章节已创建')}catch(e){toast(e.message,true)}}
function settings(){const s=D.settings||{};modal('<h2>模型与创作设置</h2><p class="hint">使用兼容 OpenAI Chat Completions 的第三方 API。密钥保存在本机后端，浏览器不会回读密钥。</p>'+field('setBase','API Base URL（例如 https://api.example.com/v1）',s.base_url)+field('setModel','默认模型 ID',s.model)+'<label>API Key '+(s.has_api_key?'（已配置，留空保留）':'（尚未配置）')+'</label><input id="setKey" type="password" autocomplete="new-password" placeholder="输入服务商提供的 API Key"><label class="context-check"><input type="checkbox" id="clearKey">清除已有 API Key</label><div class="settings-note">更换 API 地址时须重新填写密钥，避免将原服务商密钥发往新地址。</div><h3>按任务分配模型</h3><p class="hint">留空使用默认模型。各角色通过后端独立上下文调用协作。</p><div class="row">'+[['outline','大纲与摘要'],['write','正文创作'],['polish','文字润色'],['review','审阅与状态提取'],['material','素材与灵感']].map(([k,t])=>'<div>'+field('model_'+k,t,s.models?.[k]||'')+'</div>').join('')+'</div><label>创意风格</label><select id="setCreativity">'+[['balanced','平衡 · 兼顾设定与新意'],['divergent','发散 · 探索更多可能'],['convergent','收敛 · 遵循已有设定']].map(([k,t])=>'<option value="'+k+'" '+(s.creativity===k?'selected':'')+'>'+t+'</option>').join('')+'</select><div class="row"><div>'+field('setBudget','上下文预算（估计 token）',s.context_budget||12000)+'</div><div>'+field('setOutput','最大输出 token',s.max_output_tokens||2000)+'</div></div><label class="context-check"><input id="setAuto" type="checkbox" '+(s.auto_update?'checked':'')+'>接受正文后，自动提取摘要与人物 / 事件状态（额外调用）</label><label class="context-check"><input id="setTemperature" type="checkbox" '+(s.send_temperature?'checked':'')+'>向 API 发送 temperature 参数（不兼容时关闭）</label><div class="button-row"><button class="btn" onclick="toast(\'外观主题切换与系统通知尚未实现，当前采用固定暖白主题和站内提示。\')">外观 / 系统通知 · 待实现</button></div><div class="modal-actions"><button class="btn" id="testButton" onclick="testSettings()">保存并测试连接</button><button class="btn primary" onclick="saveSettings()">保存设置</button></div><div id="settingsResult" class="hint" style="margin-top:12px"></div>')}
async function persistSettings(){await guardSave();const body={base_url:val('setBase').trim(),model:val('setModel').trim(),models:Object.fromEntries(['outline','write','polish','review','material'].map(k=>[k,val('model_'+k).trim()])),creativity:val('setCreativity'),auto_update:$('setAuto').checked,send_temperature:$('setTemperature').checked,context_budget:Number(val('setBudget')),max_output_tokens:Number(val('setOutput'))};if(val('setKey'))body.api_key=val('setKey');if($('clearKey').checked)body.api_key='';if(!body.model)throw Error('请填写默认模型 ID');await api('/api/settings','POST',body);await refresh(false)}
async function saveSettings(){try{await persistSettings();closeModal();renderAll();toast('模型设置已保存')}catch(e){toast(e.message,true)}}
async function testSettings(){const b=$('testButton');try{b.disabled=true;$('settingsResult').textContent='正在保存设置并发送一次小额真实测试请求…';await persistSettings();const data=await api('/api/settings/test','POST',{});$('settingsResult').textContent=data.ok?'连接成功：'+data.reply:'连接未通过';$('setKey').value=''}catch(e){$('settingsResult').textContent='测试失败：'+e.message}finally{b.disabled=false}}
async function revisions(){try{if(!ch())return;await guardSave();const d=await api('/api/chapters/'+encodeURIComponent(chapterId)+'/revisions');const rows=d.revisions||[];modal('<h2>章节历史版本</h2><p class="hint">恢复前，当前内容会通过后端版本机制保留。</p>'+rows.map(r=>'<article class="card" style="margin-bottom:12px"><h3>'+esc(r.chapter?.title||ch().title)+'</h3><p>'+esc(r.created_at||'')+' · '+String(r.chapter?.content||'').length+' 字</p><p>'+esc((r.chapter?.content||'').slice(0,150))+'</p><button class="btn" data-revision="'+esc(r.id)+'" onclick="restoreRevision(this.dataset.revision)">恢复此版本</button></article>').join('')+(!rows.length?empty('暂无历史版本'):''))}catch(e){toast(e.message,true)}}
async function restoreRevision(id){try{await api('/api/chapters/'+encodeURIComponent(chapterId)+'/restore','POST',{revision_id:id});closeModal();await refresh();toast('历史版本已恢复')}catch(e){toast(e.message,true)}}
function exportModal(){modal('<h2>把故事，带到更远的地方</h2><p class="hint">JSON 用于完整项目备份和重新导入；TXT 用于阅读与排版。导出前将保存当前章节。</p><div class="button-row"><button class="btn primary" onclick="exportProject()">项目 JSON 备份</button><button class="btn" onclick="exportText(false)">全书 TXT</button><button class="btn" onclick="exportText(true)">本章 TXT</button><button class="btn" onclick="unsupported(\'DOCX 导出\',\'尚未实现 Word 文档导出。请使用 TXT 导出后在文档编辑器中排版。\')">DOCX 导出</button></div>')}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name.replace(/[<>:"/\\|?*]/g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function exportProject(){try{await guardSave();const data=await api('/api/export');download(D.project.title+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');closeModal();toast('项目 JSON 已导出')}catch(e){toast(e.message,true)}}
async function exportText(single){try{await guardSave();const chapters=single?[ch()].filter(Boolean):D.chapters;download(D.project.title+(single?' - '+ch()?.title:'')+'.txt',D.project.title+'\n\n'+chapters.map(c=>c.title+'\n\n'+c.content).join('\n\n──────────\n\n'),'text/plain;charset=utf-8');closeModal();toast('TXT 已导出')}catch(e){toast(e.message,true)}}
$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(busy)throw Error('请等待当前调用完成后导入');await guardSave();const data=JSON.parse(await file.text());await api('/api/import','POST',data);resetProjectState();closeModal();view='editor';await refresh();mode=D.project.mode||'assist';renderAll();toast('项目已导入')}catch(err){toast('导入失败：'+err.message,true)}finally{e.target.value=''}};

function resetProjectState(){chapterId=null;activeRun=null;dirty=false;projectDirty=false;selected={entities:new Set(),materials:new Set(),techniques:new Set()};chat=[];mode='assist';useOutline=true;renderChat()}
function showWarnings(data,success){toast(success);if(data.warnings?.length)modal('<h2>已保存，但有后续事项</h2><div class="warning">'+data.warnings.map(esc).join('<br>')+'</div><p class="hint">可在调用记录中查看失败详情，修正设置后手动重新生成摘要或状态。</p>')}
function saveGeneratedMaterial(){const r=D.runs.find(x=>x.id===activeRun);if(!r)return;editRecord('materials');$('recName').value='AI 素材 · '+chapterTitle(r.chapter_id);$('recBody').value=r.output;$('recTags').value='AI 灵感'}
function graphShell(){return '<article class="card" style="margin-bottom:20px"><div class="section-title"><h3>人物关系 · 章节快照</h3></div><label class="hint">查看截至指定章节已记录的状态；未关联章节的记录视作全局设定。</label><select id="graphChapter" onchange="renderGraph()" class="search-input"><option value="">最新记录</option>'+D.chapters.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.title)+'</option>').join('')+'</select><div id="relationGraph" style="overflow:auto"></div><div id="graphStates" class="relation-list"></div></article>'}
function renderGraph(){if(!$('relationGraph'))return;const cutoff=val('graphChapter'),positions=new Map(D.chapters.map((c,i)=>[c.id,c.position??i])),limit=cutoff?positions.get(cutoff):Infinity;let nodes=D.entities.filter(e=>['character','人物'].includes(e.type)).map(e=>{const snapshots=[...(e.history||[]),e];let eligible=snapshots.filter(h=>!h.chapter_id||(positions.get(h.chapter_id)??Infinity)<=limit);eligible.sort((a,b)=>(positions.get(a.chapter_id)??-1)-(positions.get(b.chapter_id)??-1));const state=eligible.at(-1);return state?{...e,...state,id:e.id,name:state.name||e.name}:null}).filter(e=>e&&['character','人物'].includes(e.type));const n=nodes.length;if(!n){$('relationGraph').innerHTML=empty('该章节尚无已记录的人物状态');$('graphStates').innerHTML='';return}const height=Math.max(300,Math.ceil(n/5)*200),width=Math.max(560,Math.min(n,5)*135),coords=new Map(nodes.map((e,i)=>[e.id,{x:75+(i%5)*135,y:75+Math.floor(i/5)*190}]));let lines='',labels='';for(const e of nodes)for(const r of e.relations||[]){const a=coords.get(e.id),b=coords.get(r.target_id);if(!b||r.chapter_id&&(positions.get(r.chapter_id)??Infinity)>limit)continue;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;lines+='<path d="M '+a.x+' '+a.y+' Q '+mx+' '+(my-45)+' '+b.x+' '+b.y+'" stroke="#a3b597" fill="none" marker-end="url(#arrow)"/>';labels+='<text x="'+mx+'" y="'+(my-24)+'" text-anchor="middle" font-size="10" fill="#748168">'+esc(r.label)+'</text>'}const circles=nodes.map(e=>{const c=coords.get(e.id);return '<g><circle cx="'+c.x+'" cy="'+c.y+'" r="27" fill="#e7ecdf" stroke="#98ae88"/><text x="'+c.x+'" y="'+(c.y+5)+'" text-anchor="middle" font-size="13" fill="#345f50">'+esc(e.name.slice(0,4))+'</text><title>'+esc(e.name+'：'+e.state)+'</title></g>'}).join('');$('relationGraph').innerHTML='<svg role="img" aria-label="章节人物关系图" viewBox="0 0 '+width+' '+height+'" style="width:100%;min-width:400px;height:auto;stroke:none"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="30" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a3b597"/></marker></defs>'+lines+labels+circles+'</svg>';$('graphStates').innerHTML=nodes.map(e=>'<div class="history-entry"><strong>'+esc(e.name)+'</strong> · '+esc(e.state||'暂无状态')+'<br><small>快照章节：'+esc(chapterTitle(e.chapter_id))+'</small></div>').join('')}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveChapter().catch(()=>{})}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showView('search')}if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatInput'){e.preventDefault();sendChat()}});window.addEventListener('beforeunload',e=>{if(dirty||projectDirty||busy){e.preventDefault();e.returnValue=''}});refresh().catch(e=>{$('content').innerHTML=wrap('工作室暂时未连接','请启动本地服务后，通过服务地址打开页面。','<div class="error">'+esc(e.message)+'</div><button class="btn" onclick="location.reload()" style="margin-top:20px">重新连接</button>');$('saveState').textContent='连接失败'});
</script></body></html>
